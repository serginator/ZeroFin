name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DZEROFIN_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The device build: the same Debian 13 arm64 image as the Cardputer Zero.
  deb:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: tools/build-deb.sh dist
      - name: Check the package
        run: |
          dpkg-deb --info dist/zerofin_*.deb
          dpkg-deb --contents dist/zerofin_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: zerofin-deb
          path: dist/zerofin_*.deb
          if-no-files-found: error
