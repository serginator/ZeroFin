<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ZeroFin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8C8"/>
      <stop offset="1" stop-color="#2F3FD0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The zero: a thick ring, slightly tall like a digit. -->
  <ellipse cx="256" cy="268" rx="132" ry="152" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <!-- The fin: a dorsal fin that rises from the top of the zero. -->
  <path d="M256 118 C 286 62 344 40 392 44 C 366 70 352 104 350 150 Z" fill="#FFFFFF"/>
  <!-- The play triangle, centred on the zero. -->
  <path d="M232 214 L232 322 L322 268 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
</svg>
